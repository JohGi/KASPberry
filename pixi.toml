[workspace]
authors = ["JohGi <tjohanna.girodolle@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "kaspberry"
platforms = ["linux-64"]
version = "0.1.0"

# -------------------------------------------------------------------
# KASPberry launcher / workflow orchestration
# -------------------------------------------------------------------

[feature.workflow.dependencies]
python = ">=3.13.12,<3.14"
pyyaml = ">=6.0.3,<7"
polars = ">=1.39.3,<2"
snakemake = ">=9.19.0,<10"
conda = "*"
snakemake-executor-plugin-slurm = ">=2.6.0,<3"

[feature.workflow.tasks]
kaspberry = "python workflow/scripts/kaspberry.py"


# -------------------------------------------------------------------
# Developer / test-only Python dependencies
# -------------------------------------------------------------------

[feature.dev.dependencies]
pytest = ">=9.0.2,<10"
biopython = ">=1.87,<2"
attrs = "*"

[feature.dev.tasks]
test = "pytest .tests"


# -------------------------------------------------------------------
# Environments
# -------------------------------------------------------------------

[environments]
default = { features = ["workflow"], no-default-feature = true }
dev = { features = ["workflow", "dev"], no-default-feature = true }
