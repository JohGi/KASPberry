name: Publish PolyMarker container

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/johgi/kaspberry-polymarker
  IMAGE_TAG: 1.3.3-k1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container
        run: |
          docker build \
            --pull \
            --file containers/polymarker/Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Smoke-test container
        run: |
          docker run --rm "${IMAGE_NAME}:${IMAGE_TAG}" \
            bash -c '
              set -euo pipefail

              echo "Ruby:"
              ruby --version

              echo
              echo "PolyMarker:"
              gem list --local bio-polymarker \
                | grep -F "bio-polymarker (1.3.3)"
              command -v polymarker.rb
              polymarker.rb --help >/dev/null

              echo
              echo "SortedSet:"
              gem list --local sorted_set \
                | grep -F "sorted_set (1.0.3)"
              ruby -e '\''require "set"; require "sorted_set"; s = SortedSet.new([3,1,2]); abort unless s.to_a == [1,2,3]'\''

              echo
              echo "MAFFT:"
              mafft --version 2>&1

              echo
              echo "Primer3:"
              primer3_core --about 2>&1

              echo
              echo "Exonerate:"
              exonerate_version="$(exonerate --version 2>&1 || true)"
              echo "${exonerate_version}"
              grep -Fq "exonerate version 2.4.0" <<< "${exonerate_version}"

              echo
              echo "BLAST:"
              blastn -version

              echo
              echo "PolyMarker container smoke test OK"
            '

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Push container
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
