project:
  name: "Test dataset"
  output_dir: results

inputs:
  genotypes: dev/integration_case_builder/dataset/generated/genotypes.tsv
  annotations: dev/integration_case_builder/dataset/annotations.tsv
  chromosomes: dev/integration_case_builder/dataset/generated/chromosomes.tsv   # required for kasp if polymarker_genomes > 1

snps:
  min_block_length: 450
  min_snp_flank: 0
  repeat_masking:
    library: ".tests/integration/resources/mini_TE_lib.fasta"

kasp:
  polymarker_genomes: 2

viewer:
  dotplot_reference: null

advanced:
  sibeliaz:
    extra_options: []
  batching:
    blocks_per_chunk: 2
  alignment:
    mafft_options: []
