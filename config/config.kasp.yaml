# KASPberry example configuration — KASP assay mode
#
# Paths are resolved relative to the Snakemake working directory
# selected with --directory.
#
# In kasp mode, min_snp_flank must be >= 50 bp.
# chromosomes.tsv is required when polymarker_genomes > 1.

project:
  name: "Example KASP analysis"

inputs:
  genotypes: genotypes.kasp.tsv
  annotations: null              # optional; e.g. annotations.tsv
  chromosomes: chromosomes.kasp.tsv

snps:
  min_block_length: 450
  min_snp_flank: 50
  repeat_masking:
    library: null                 # optional custom repeat library

kasp:
  polymarker_genomes: 2           # number of subgenomes in the target group

  mfeprimer:
    specificity:
      min_tm: 50
    dimer:
      max_dg: -3.5

viewer:
  dotplot_reference: null

advanced:
  sibeliaz:
    extra_options: []

  batching:
    blocks_per_chunk: 2

  alignment:
    mafft_options: []

  mfeprimer:
    kmer_size: 9
    specificity_extra_options: []
    dimer_extra_options: []
    hairpin_extra_options: []
